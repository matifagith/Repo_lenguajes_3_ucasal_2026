<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas de Proyecto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light">
    <div class="container py-5">
        <h1 id="main-title" class="text-center mb-4">
            Gestor de Tareas de Proyecto
        </h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="task-form" class="row g-3">
                    <div class="col-md-6">
                        <label for="taskName" class="form-label">Nombre de la tarea</label>
                        <input type="text" class="form-control" id="taskName"
                            placeholder="Ej: Estudiar para Sistemas 1" />
                    </div>
                    <div class="col-md-4">
                        <label for="priority" class="form-label">Prioridad</label>
                        <select id="priority" class="form-select">
                            <option value="Alta">Alta</option>
                            <option value="Media" selected>Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" id="btn-add" class="btn btn-primary w-100">
                            Agregar
                        </button>
                        <button type="button" id="btn-random" class="btn btn-outline-secondary w-100">
                            Cargar 10 Random
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table id="tablaTareas" class="display table table-striped w-100">
                    <thead>
                        <tr>
                            <th>Tarea</th>
                            <th>Prioridad</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Las tareas se insertarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts: jQuery, DataTables, y Custom JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
