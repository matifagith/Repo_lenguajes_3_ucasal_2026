<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafíos 3 — Registrador de Números con Estadísticas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    <style>
      .page-header {
        background: linear-gradient(135deg, #1a73e8, #0d47a1);
        color: white;
        border-radius: 0 0 1rem 1rem;
        padding: 2rem 1.5rem 1.5rem;
        margin-bottom: 2rem;
      }
      .btn-nav-custom {
        border: 1px solid white !important; /* Borde blanco */
        color: white !important;           /* Texto blanco */
        background-color: transparent;     /* Fondo transparente */
        margin-left: 10px;                 /* Separación entre botones */
        border-radius: 5px;                /* Bordes redondeados */
        transition: all 0.3s ease;         /* Animación suave */
    }

    /* Estado cuando pasas el mouse o está seleccionado */
    .btn-nav-custom:hover, 
    .btn-nav-custom.active {
        background-color: white !important;
        color: black !important;
        font-weight: bold;
    }
    </style>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });
    </script>
    <div class="page-header text-center">
      <h1 class="fw-bold mb-1">
        <i class="bi bi-mortarboard-fill me-2"></i>Registrador de Números con Estadísticas
      </h1>
      <p class="mb-0 opacity-75">Desafío 3 - Lenguajes III · 2026</p>
    </div>
    <div class="container" style="max-width: 900px">
      <!--<h1 class="text-center text-primary mb-4">Analizador Numérico y Tablas</h1>-->

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row align-items-end">
            <div class="col-md-8">
              <label for="inputNumero" class="form-label fw-bold"
                >Ingresá un número:</label
              >
              <input
                type="number"
                id="inputNumero"
                class="form-control"
                placeholder="Ej: 7"
              />
              <div id="errorNumero" class="text-danger mt-2 fw-semibold"></div>
            </div>
            <div class="col-md-4">
              <button class="btn btn-primary w-100" onclick="procesarNumero()">
                Agregar Número
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-dark text-white fw-bold">
              Clasificación
            </div>
            <div class="card-body" id="divAnalisis">
              <span class="text-muted fst-italic">Esperando datos...</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-success text-white fw-bold">
              Tabla de Multiplicar
            </div>
            <div class="card-body" id="tabla">
              <span class="text-muted fst-italic">Esperando datos...</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-info text-dark fw-bold">
              Estadísticas Totales
            </div>
            <div class="card-body" id="divResumen">
              <span class="text-muted fst-italic">Esperando datos...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button class="btn btn-outline-danger px-5" onclick="reiniciar()">
          Reiniciar Todo
        </button>
      </div>
    </div>

    <script src="desafio3.js"></script>
    <script>
      // Función puente que unifica la lógica como en el código original
      function procesarNumero() {
        var inputValor = document.getElementById("inputNumero").value.trim();
        var errorDiv = document.getElementById("errorNumero");
        errorDiv.innerHTML = "";

        if (inputValor === "" || isNaN(inputValor)) {
          errorDiv.innerHTML =
            "Error: Debes ingresar un valor numérico válido.";
          return;
        }

        var numeroValido = parseFloat(inputValor);

        // Llamamos a las funciones de los archivos externos
        clasificarYTabla(numeroValido); // Definida en logica_desafio2.js
        calcularEstadisticas(numeroValido); // Definida en logica_desafio3.js

        document.getElementById("inputNumero").value = "";
        document.getElementById("inputNumero").focus();
      }
    </script>
  </body>
</html>
